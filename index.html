<!DOCTYPE html>
<html lang="en">
<head>

    <title>CALCULADORA</title>
</head>
<body><center>
    <h1>CALCULADORA</h1>
    <form name="MENU">
        <p>Numero1:<input type="text" name="caja1" size="20"></p>
        <p>Numero2:<input type="text" name="caja2" size="20"></p>
        <p>Resultado:<input type="text" name="result" size="20"></p>
        <p>
            <input type="button" value="SUMAR" onclick="SUMAR()">
            <input type="button" value="RESTAR" onclick="RESTAR()">
            <input type="button" value="MULTIPLICAR" onclick="MULT()">
            <input type="button" value="DIVIDIR" onclick="DIV()">
        
        </p>
</form></center>

<script>
    function SUMAR(){
        var n1 = parseFloat(document.MENU.caja1.value);
        var n2 = parseFloat(document.MENU.caja2.value);
        document.MENU.result.value= n1+n2;
    }

    function RESTAR(){
        var n1 = parseFloat(document.MENU.caja1.value);
        var n2 = parseFloat(document.MENU.caja2.value);
        document.MENU.result.value= n1-n2;
    }

    function MULT(){
        var n1 = parseFloat(document.MENU.caja1.value);
        var n2 = parseFloat(document.MENU.caja2.value);
        document.MENU.result.value= n1*n2;
    }

    function DIV(){
        var n1 = parseFloat(document.MENU.caja1.value);
        var n2 = parseFloat(document.MENU.caja2.value);
        document.MENU.result.value= n1/n2;
    }

</script>


</body>
</html>
